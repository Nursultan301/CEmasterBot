[project]
name = "cemasterbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.22.0",
    "fastapi[standard]>=0.124.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "orjson>=3.11.5",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.11.10",
    "setuptools>=80.9.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
]

[tool.uv]
package = false

# Настройки Black (форматирование кода)
[tool.black]
line-length = 88
target-version = ["py312"]
skip-string-normalization = false
preview = true

